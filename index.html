<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }

    window.onload = () => {

        loadComponents('header', 'src/sections/header.html');
        
        loadComponents('page1-section1', 'src/sections/page1-section1.html');
        loadComponents('content', 'src/sections/content.html');
        loadComponents('home-section4.html', 'src/sections/home-section4.html');
        loadComponents('footer', 'src/sections/footer.html');
}
</script>
<body class="bg-[#EFECEA]">
    <div id="header"></div>
    <div id="page1-section1"></div>
    <div id="content"></div>
    <div id="home-section4.html"></div>
    <div id="footer"></div>
</body>
</html>
