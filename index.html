<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }

    window.onload = () => {

        loadComponents('header', 'src/sections/header.html');
        loadComponents('hero', 'src/sections/hero.html');
        loadComponents('content', 'src/sections/content.html');
        loadComponents('home-section4.html', 'src/sections/home-section4.html');
        loadComponents('page4-Privacypolicy-section2.html', 'src/sections/page4-Privacypolicy-section2.html');
        loadComponents('footer', 'src/sections/footer.html');
        loadComponents('content', 'src/sections/content.html');
    }
</script>
<body>
   <!--  <div id="header"></div>
    <div id="hero"></div> -->
    <div id="content"></div>
    <!-- <div id="home-section4.html"></div> -->

    <div id="page4-Privacypolicy-section2.html"></div>
    <div id="footer"></div>
</body>
</html>
